name: YouTube to Pinterest + Facebook + Instagram (Galaxy Of Games AR)
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}      # manual Run button

concurrency:
  group: youtube-to-pinterest
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERNIO_PINTEREST_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_MAIN_KEY: ${{ secrets.ZERNIO_MAIN_KEY }}
      FACEBOOK_ACCOUNT_ID: 6b087a8859ca59669b3a2c5a   # Facebook Page "mineWolrd"
      YT_CHANNEL_ID: UCppjXBahPLC3G_5ZcP6t0RA
      PINTEREST_BOARD_NAME: MINECRAFT
      PLATFORMS: pinterest,facebook,instagram
      # ZERNIO_INSTA_KEY: only needed if the Instagram accounts are in a different Zernio account
      ZERNIO_INSTA_KEY: ${{ secrets.ZERNIO_INSTA_KEY }}
      MAX_AGE_HOURS: "72"
      MAX_PINS_PER_RUN: "1"   # one upload (Short or video) per run, shared to every platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/youtube_to_pinterest.py
